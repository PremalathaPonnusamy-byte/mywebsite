    @keyframes reveal-scale{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
    @keyframes line-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

    .reveal{opacity:0;transform:translateY(40px);transition:all 0.8s cubic-bezier(0.16,1,0.3,1)}
    .reveal-left{opacity:0;transform:translateX(-40px);transition:all 0.8s cubic-bezier(0.16,1,0.3,1)}
    .reveal-right{opacity:0;transform:translateX(40px);transition:all 0.8s cubic-bezier(0.16,1,0.3,1)}
    .reveal-scale{opacity:0;transform:scale(0.9);transition:all 0.8s cubic-bezier(0.16,1,0.3,1)}
    .revealed{opacity:1!important;transform:translate(0) scale(1)!important}

    .toast{position:fixed;bottom:2rem;right:2rem;background:#1a1a1a;border:1px solid rgba(233,30,99,0.3);color:#fff;padding:1rem 1.5rem;border-radius:12px;z-index:9999;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(0.16,1,0.3,1)}

          { image: "https://picsum.photos/seed/agency-growth/600/400.jpg", title: "Agency White-Label SEO", category: "Agency · Strategy", metric: { value: "20+", label: "Client Accounts" }, description: "Built and managed white-label SEO operations for a digital marketing agency, handling 20+ client accounts simultaneously." }
        ]
      },
      knowledge: {
        label: "Knowledge Panel",
        heading: "At a Glance",
        photo: "https://picsum.photos/seed/professional-woman-portrait/300/300.jpg",
        name: "Premalatha P",
        title: "SEO Manager",
        description: "Experienced SEO Manager specializing in technical SEO, content strategy, and data-driven organic growth for businesses across multiple industries.",
        facts: [
          { label: "Experience", value: "5+ Years in SEO" },
          { label: "Specialization", value: "Technical & Content SEO" },
          { label: "Industries", value: "E-commerce, SaaS, Healthcare" },
          { label: "Based in", value: "India" }
        ],
        specializations: ["Technical SEO", "Content Strategy", "Link Building", "Local SEO", "E-commerce SEO", "SaaS SEO"],
        tools: ["Google Analytics", "Ahrefs", "SEMrush", "Screaming Frog", "Google Search Console", "Surfer SEO"],
        certifications: ["Google Analytics Certified", "HubSpot SEO Certified", "SEMrush SEO Toolkit Certified"]
      },
      contact: {
        label: "Let's Connect",
        heading: "Get in Touch",
        description: "Have a project in mind or want to discuss how SEO can grow your business? I'd love to hear from you.",
        email: "premalatha.seo@gmail.com",
        linkedin: "https://www.linkedin.com/in/premalatha-p-b4000411b/",
        location: "India",
        availability: "Open to opportunities",
        formSubjects: ["SEO Audit Request", "Content Strategy", "Technical SEO", "Local SEO", "General Inquiry"]
      },
      footer: {
        copyright: "© 2025 Premalatha P. All rights reserved.",
        tagline: "Growing businesses through strategic SEO"
      }
    };

    let DATA = DEFAULT_DATA;

    // ========== LOAD DATA ==========
    async function loadData() {
      try {
        const res = await fetch('data.json');
        if (res.ok) DATA = await res.json();
      } catch(e) { /* use defaults */ }
      render();
    }

    // ========== RENDER ==========
    function render() {
      // Hero
      document.getElementById('hero-greeting').textContent = DATA.hero.greeting;
      document.getElementById('hero-name').textContent = DATA.hero.name;
      document.getElementById('hero-lastName').textContent = DATA.hero.lastName;
      document.getElementById('hero-title').textContent = DATA.hero.title;
      document.getElementById('hero-subtitle').textContent = DATA.hero.subtitle;
      document.getElementById('hero-cta1').querySelector('span').textContent = DATA.hero.ctaPrimary;
      document.getElementById('hero-cta2').textContent = DATA.hero.ctaSecondary;

      // About
      document.getElementById('about-label').textContent = DATA.about.label;
      document.getElementById('about-heading').textContent = DATA.about.heading;
      const descParts = DATA.about.description.split('\n\n');
      document.getElementById('about-description').innerHTML = descParts.map(p => `<p>${p}</p>`).join('');
      document.getElementById('about-stats').innerHTML = DATA.about.stats.map((s, i) => `
        <div class="metric-card rounded-2xl p-6 text-center transition-all duration-300 reveal delay-${i+1}">
          <p class="font-serif text-3xl md:text-4xl gradient-text mb-2">${s.value}</p>
          <p class="text-gray-500 text-xs tracking-widest uppercase">${s.label}</p>
        </div>
      `).join('');

      // Services
      document.getElementById('services-label').textContent = DATA.services.label;
      document.getElementById('services-heading').textContent = DATA.services.heading;
      document.getElementById('services-grid').innerHTML = DATA.services.items.map((s, i) => `
        <div class="card-glow group bg-white/[0.02] border border-white/[0.06] rounded-2xl p-8 hover:border-pk-500/20 transition-all duration-500 reveal delay-${(i%3)+1}">
          <div class="w-12 h-12 rounded-xl bg-pk-500/10 flex items-center justify-center mb-5 group-hover:bg-pk-500/20 transition-colors">
            <span class="iconify text-pk-400" data-icon="${s.icon}" data-width="22"></span>
          </div>
          <h3 class="text-white text-lg font-medium mb-3">${s.title}</h3>
          <p class="text-gray-500 text-sm leading-relaxed">${s.description}</p>
        </div>
      `).join('');

      // Case Studies
      document.getElementById('cases-label').textContent = DATA.caseStudies.label;
      document.getElementById('cases-heading').textContent = DATA.caseStudies.heading;
      const f = DATA.caseStudies.featured;
      document.getElementById('cases-featured').innerHTML = `
        <div class="case-card group bg-white/[0.02] border border-white/[0.06] rounded-2xl overflow-hidden hover:border-pk-500/20 transition-all duration-500 reveal">
          <div class="grid lg:grid-cols-2">
            <div class="aspect-[4/3] lg:aspect-auto overflow-hidden">
              <img src="${f.image}" alt="${f.title}" class="case-img w-full h-full object-cover">
            </div>
            <div class="p-8 md:p-10 flex flex-col justify-center">
              <span class="text-pk-400 text-xs tracking-widest uppercase mb-4">${f.category}</span>
              <h3 class="font-serif text-2xl md:text-3xl text-white mb-4">${f.title}</h3>
              <p class="text-gray-400 text-sm leading-relaxed mb-6">${f.description}</p>
              <div class="flex flex-wrap gap-3 mb-6">
                ${f.metrics.map(m => `<div class="metric-card rounded-xl px-4 py-2 text-center"><p class="text-pk-400 font-serif text-xl">${m.value}</p><p class="text-gray-600 text-[10px] uppercase tracking-wider">${m.label}</p></div>`).join('')}
              </div>
              <ul class="space-y-2">
                ${f.results.map(r => `<li class="flex items-start gap-2 text-sm text-gray-500"><span class="iconify text-pk-500 mt-0.5 flex-shrink-0" data-icon="lucide:check" data-width="14"></span>${r}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>
      `;
      document.getElementById('cases-grid').innerHTML = DATA.caseStudies.items.map((c, i) => `
        <div class="case-card group bg-white/[0.02] border border-white/[0.06] rounded-2xl overflow-hidden hover:border-pk-500/20 transition-all duration-500 reveal delay-${i+1}">
          <div class="aspect-[3/2] overflow-hidden">
            <img src="${c.image}" alt="${c.title}" class="case-img w-full h-full object-cover">
          </div>
          <div class="p-6">
            <span class="text-pk-400 text-[10px] tracking-widest uppercase">${c.category}</span>
            <h3 class="font-serif text-lg text-white mt-2 mb-2">${c.title}</h3>
            <p class="text-gray-500 text-sm leading-relaxed mb-4">${c.description}</p>
            <div class="metric-card rounded-xl px-4 py-2 inline-flex items-center gap-2">
              <span class="text-pk-400 font-serif text-xl">${c.metric.value}</span>
              <span class="text-gray-600 text-[10px] uppercase tracking-wider">${c.metric.label}</span>
            </div>
          </div>
        </div>
      `).join('');

      // Knowledge Panel
      document.getElementById('knowledge-label').textContent = DATA.knowledge.label;
      document.getElementById('knowledge-heading').textContent = DATA.knowledge.heading;
      const k = DATA.knowledge;
      document.getElementById('knowledge-panel').innerHTML = `
        <div class="knowledge-card rounded-xl overflow-hidden">
          <div class="bg-gradient-to-r from-gray-50 to-white p-8 text-center border-b border-gray-100">
            <img src="${k.photo}" alt="${k.name}" class="w-24 h-24 rounded-full object-cover mx-auto mb-4 ring-4 ring-white shadow-lg">
            <h3 class="text-xl font-medium text-gray-900">${k.name}</h3>
            <p class="text-sm text-gray-500">${k.title}</p>
          </div>
          <div class="p-6 space-y-5">
            <p class="text-sm text-gray-600 leading-relaxed">${k.description}</p>
            <div class="space-y-3">
              ${k.facts.map(f => `<div class="flex justify-between py-1.5 border-b border-gray-100"><span class="text-xs text-gray-400 uppercase tracking-wider">${f.label}</span><span class="text-sm text-gray-800 font-medium">${f.value}</span></div>`).join('')}
            </div>
            <div>
              <p class="text-xs text-gray-400 uppercase tracking-wider mb-2">Specializes in</p>
              <div class="flex flex-wrap gap-1.5">
                ${k.specializations.map(s => `<span class="px-2.5 py-1 bg-gray-100 text-gray-700 text-xs rounded-full">${s}</span>`).join('')}
              </div>
            </div>
            <div>
              <p class="text-xs text-gray-400 uppercase tracking-wider mb-2">Tools</p>
              <div class="flex flex-wrap gap-1.5">
                ${k.tools.map(t => `<span class="px-2.5 py-1 bg-blue-50 text-blue-700 text-xs rounded-full">${t}</span>`).join('')}
              </div>
            </div>
            <div>
              <p class="text-xs text-gray-400 uppercase tracking-wider mb-2">Certifications</p>
              <div class="flex flex-wrap gap-1.5">
                ${k.certifications.map(c => `<span class="px-2.5 py-1 bg-green-50 text-green-700 text-xs rounded-full">${c}</span>`).join('')}
              </div>
            </div>
            <div class="pt-3 border-t border-gray-100 flex items-center gap-1.5 text-xs text-gray-400">
              <span class="iconify" data-icon="lucide:info" data-width="12"></span>
              Information from portfolio. Last updated 2025.
            </div>
          </div>
        </div>
      `;

      // Contact
      document.getElementById('contact-label').textContent = DATA.contact.label;
      document.getElementById('contact-heading').textContent = DATA.contact.heading;
      document.getElementById('contact-description').textContent = DATA.contact.description;
      const emailEl = document.getElementById('contact-email');
      emailEl.textContent = DATA.contact.email;
      emailEl.href = `mailto:${DATA.contact.email}`;
      document.getElementById('contact-linkedin').href = DATA.contact.linkedin;
      document.getElementById('contact-location').querySelector('span:last-child').textContent = DATA.contact.location;
      document.getElementById('contact-availability').textContent = DATA.contact.availability;
      const sel = document.getElementById('subjectSelect');
      sel.innerHTML = DATA.contact.formSubjects.map(s => `<option value="${s}">${s}</option>`).join('');

      // Footer
      document.getElementById('footer-copyright').textContent = DATA.footer.copyright;
      document.getElementById('footer-tagline').textContent = DATA.footer.tagline;

      // Re-observe new elements
      initObservers();
    }

    // ========== SCROLL ANIMATIONS ==========
    function initObservers() {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('revealed'); obs.unobserve(e.target); } });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
      document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.reveal-scale').forEach(el => obs.observe(el));
    }

    // ========== NAVBAR ==========
    let lastScroll = 0;
    window.addEventListener('scroll', () => {
      const nav = document.getElementById('navbar');
      const scroll = window.scrollY;
      if (scroll > 50) {
        nav.classList.add('bg-dk-600/90', 'nav-blur', 'border-b', 'border-white/5');
      } else {
        nav.classList.remove('bg-dk-600/90', 'nav-blur', 'border-b', 'border-white/5');
      }
      lastScroll = scroll;
    });

    // ========== MOBILE MENU ==========
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    let menuOpen = false;
    menuBtn.addEventListener('click', () => {
      menuOpen = !menuOpen;
      mobileMenu.style.transform = menuOpen ? 'translateX(0)' : 'translateX(-100%)';
      menuBtn.innerHTML = menuOpen
        ? '<span class="iconify" data-icon="lucide:x" data-width="24"></span>'
        : '<span class="iconify" data-icon="lucide:menu" data-width="24"></span>';
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        menuOpen = false;
        mobileMenu.style.transform = 'translateX(-100%)';
        menuBtn.innerHTML = '<span class="iconify" data-icon="lucide:menu" data-width="24"></span>';
      });
    });

    // ========== CONTACT FORM ==========
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Message sent! I\'ll get back to you soon.');
      e.target.reset();
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ========== INIT ==========
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 700);
      loadData();
    });
  </script>
</body>
</html>
